# Server config for local development against dev/docker-compose.yaml.
# Values wrapped in ${...} are read from the environment at load time (see
# internal/config/config.go) so secrets never need to be committed here.

http:
  addr: ":8877"
  read_timeout: 10s
  write_timeout: 15s
  shutdown_timeout: 15s
  max_body_bytes: 1048576   # 1 MiB

# MCP uses Streamable HTTP on the same listener as the REST API. Keeping it on
# a distinct path allows an ingress to expose or restrict it independently.
mcp:
  enabled: ${MCP_ENABLED:-true}
  path: "${MCP_PATH:-/mcp}"
  max_body_bytes: 1048576

# Native gRPC uses its own HTTP/2 listener. Reflection is enabled here for
# local grpcurl use; disable it on an Internet-facing production listener.
grpc:
  enabled: ${GRPC_ENABLED:-true}
  addr: "${GRPC_ADDR:-:8878}"
  shutdown_timeout: 15s
  max_receive_message_bytes: 1048576
  reflection_enabled: ${GRPC_REFLECTION_ENABLED:-true}

# Swagger UI and the OpenAPI document are exposed under /docs only when
# explicitly enabled. Keep this disabled by default outside local development.
swagger:
  enabled: ${SWAGGER_ENABLED:-true}

database:
  driver: "${DB_DRIVER:-postgres}"
  dsn: "${DATABASE_URL:-postgres://test:test@127.0.0.1:5432/test?sslmode=disable}"
  auto_create: ${DB_AUTO_CREATE:-true}
  max_conns: 20
  min_conns: 2

# Exactly one delivery driver should be enabled: "memory", "nsq" or
# "rabbitmq". Memory embeds the worker in this server process.
mq:
  driver: "${MQ_DRIVER:-memory}"
  memory:
    buffer_size: 1024
    default_requeue_delay: 1s
    max_requeue_delay: 1m
    max_attempts: 5
  nsq:
    nsqd_addr: "nsqd:4150"
    lookupd_addrs:
      - "nsqlookupd:4161"
    topic: "notification-delivery"
    channel: "delivery-worker"
    default_requeue_delay: 5s
    max_requeue_delay: 1m
    max_attempts: 5
  rabbitmq:
    url: "${RABBITMQ_URL:-amqp://test:test@127.0.0.1:5672/}"
    exchange: ""
    exchange_type: "direct"
    queue: "notification-delivery"
    routing_key: ""
    durable: true
    prefetch_count: 20
    reconnect_delay: 5s
    default_requeue_delay: 5s
    max_requeue_delay: 1m
    max_attempts: 5

# Used only when mq.driver is "memory". The standalone cmd/worker cannot
# consume an in-process channel.
worker:
  lease:
    duration: 60s
    renew_interval: 20s
  concurrency: 10
  compensator:
    publish_scan_interval: 15s
    publish_batch_size: 500
    lease_scan_interval: 15s
    lease_scan_batch_size: 200
  http_client:
    max_response_bytes: 65536
    allowed_response_headers:
      - "Content-Type"
      - "X-Request-Id"

# Bearer tokens authenticate REST, MCP and gRPC access and are not associated
# with a source_system. Empty tokens are ignored. If no non-empty token is
# configured, the server generates one at startup and prints it in the log.
auth:
  tokens:
    - "${AUTH_TOKEN:-dev-system-token}"

providers_file: "config/providers.yaml"

auto_migrate: true
